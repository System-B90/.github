name: Teardown Hive
description: >-
  Tears down the Hive stack and reclaims its disk. Call with `if: always()` as
  the last step of any job that used actions/setup-hive.

  setup-hive cleans up leftovers at the START of a run, which is enough to keep
  a run correct but not enough to keep the box healthy: between a job finishing
  and the next one starting, a dead stack's containers, volumes and images sit
  on a shared 8-vCPU box that reported "Free space left: 0 MB" on 2026-07-24
  (System-B90/.github#12). Releasing at the end shrinks that window to nothing.

  Never fails the job. A cleanup error must not turn a green run red, so every
  step is best-effort and reports rather than exits.

inputs:
  hive-path:
    description: Directory Hive was checked out into. Must match setup-hive's input.
    required: false
    default: hive
  prune:
    description: >-
      How much to reclaim after the stack is down.
      "safe" (default) removes stopped containers, dangling images, unused build
      cache and unused volumes — never a tagged image another concurrently
      running job may be using.
      "aggressive" additionally removes untagged-and-unused images; use only
      where jobs are known not to overlap.
      "none" tears the stack down without pruning.
    required: false
    default: safe
  report-disk:
    description: Print disk and Docker usage after cleanup, for tracking the box's headroom over time.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Tear down Hive stack
      if: always()
      shell: bash
      env:
        HIVE_PATH: ${{ inputs.hive-path }}
      run: bash "$GITHUB_ACTION_PATH/teardown-stack.sh"

    - name: Reclaim disk
      if: always() && inputs.prune != 'none'
      shell: bash
      env:
        PRUNE: ${{ inputs.prune }}
      run: |
        set +e
        docker container prune -f
        docker volume prune -f
        docker network prune -f
        docker builder prune -f --keep-storage 10GB
        if [ "$PRUNE" = "aggressive" ]; then
          docker image prune -af
        else
          docker image prune -f
        fi
        exit 0

    - name: Report disk usage
      if: always() && inputs.report-disk == 'true'
      shell: bash
      run: |
        set +e
        echo "## Runner disk after teardown" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        df -h / 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "Docker usage:"
        docker system df
        exit 0
