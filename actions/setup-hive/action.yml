name: Setup Hive
description: >-
  Boots a full Hive (LMS backend / SSO identity provider) stack on the current
  runner for E2E testing. Handles runner disk cleanup, Hive checkout, image
  acquisition (source build with commit-keyed cache, or registry pull),
  stack initialization, and the readiness check. Shared by all System-B90
  consumer repos (Bluz, Peek-a-boo, Madash, hive-core) so the Hive boot
  sequence lives in exactly one place.

inputs:
  hive-token:
    description: >-
      PAT with read access to org repos. Required for image-source: build
      (clones Hive's private source). Also used for image-source: registry's
      checkout of pyhive-repo's hive-stack/ directory, since pyhive-repo is
      private and the default GITHUB_TOKEN can't read across repos even
      within the same org — falls back to github.token if omitted, which
      only works if pyhive-repo is public or this repo has been granted
      explicit read access to it.
      Pass the repo's secret, e.g. secrets.SYSTEM_B90_READ.
    required: false
    default: ""
  hive-repo:
    description: Hive repository (owner/name). Build mode only.
    required: false
    default: hivelms/Hive
  hive-ref:
    description: Hive branch/ref to check out (build mode) or match in pyhive's hive-stack (registry mode).
    required: false
    default: feature/sso
  hive-path:
    description: Directory (relative to the workspace) to check Hive out into.
    required: false
    default: hive
  hive-hostname:
    description: Hostname that Hive's nginx serves, mapped to hive-host-ip.
    required: false
    default: hive.org
  hive-host-ip:
    description: >-
      Loopback address Hive's nginx publishes on, and therefore what
      hive-hostname must resolve to on the runner. Matches the bind address in
      pyhive's hive-stack/docker-compose.yaml; Hive keeps its own alias so a
      co-located consumer (Bluz on 127.0.0.3) does not collide with it on
      :80/:443.
    required: false
    default: 127.0.0.6
  extra-hosts:
    description: >-
      Extra /etc/hosts lines for the consumer app, one per line,
      e.g. "127.0.0.3 bluz.dev".
    required: false
    default: ""
  python-version:
    description: Python version to set up (build mode only — Hive's manage script needs it).
    required: false
    default: "3.11"
  image-source:
    description: >-
      Where Hive runtime images come from. "build" clones hivelms/Hive
      (private, needs hive-token) and builds from source, caching the built
      images keyed on the Hive commit SHA. "registry" (recommended) pulls
      prebuilt images published by pyhive-repo's "Publish Hive Images"
      workflow, and reads the matching docker-compose.yaml/.env from that
      same repo's public hive-stack/ directory — no token needed at all.
    required: false
    default: build
  pyhive-repo:
    description: >-
      Repository (owner/name) whose hive-stack/ directory and published
      images registry mode reads. Must be a public repo (or one the
      default GITHUB_TOKEN can read) — this checkout uses github.token,
      not a dedicated hive-token, since it only reads two config files.
    required: false
    default: System-B90/pyhive
  registry-prefix:
    description: >-
      Registry namespace holding published Hive images (registry mode only).
      Images are expected at "<prefix>/<service>:<tag>" where <service> is the
      compose image name with the "hive/" prefix stripped. The default is
      populated by pyhive-repo's "Publish Hive Images" workflow.
    required: false
    default: ghcr.io/system-b90/hive
  registry-token:
    description: >-
      Token used to `docker login` before pulling (registry mode only). The
      default GITHUB_TOKEN works when the Hive packages grant this repo
      access (package settings → Manage Actions access); otherwise pass a PAT
      with read:packages.
    required: false
    default: ${{ github.token }}
  registry-tag:
    description: >-
      Image tag to pull in registry mode. Defaults to the HIVE_SHA recorded
      in pyhive-repo's hive-stack/ directory at publish time.
    required: false
    default: ""
  cache-version:
    description: Bump to invalidate the built-image cache (build mode only).
    required: false
    default: v1
  free-disk-space:
    description: >-
      How aggressively to reclaim disk before booting Hive. Some cleanup always
      happens unless this is "false".
      "auto" (default) picks by runner: on GitHub-hosted it removes the ~30 GB
      of preinstalled .NET/Android/GHC/CodeQL toolchains and flushes the image
      store, which is free on a VM that is discarded afterwards. On self-hosted
      it reclaims only unambiguous garbage — dangling images, stopped
      containers, unused build cache, unused volumes — leaving tagged images
      other jobs may be mid-way through using, and never touching toolchain
      directories that are not the runner's to delete.
      "true" forces the full GitHub-hosted treatment on any runner; "false"
      skips cleanup entirely.
    required: false
    default: "auto"
  min-free-disk-gb:
    description: >-
      Fail the job before booting Hive if less than this many GB remain after
      cleanup. A Hive stack needs roughly 8 GB of images plus its database and
      logs; starting one below that does not fail cleanly, it fails as
      "dockerd not ready after 120s" or a container that takes 11 minutes to
      create, 20 minutes into the run (System-B90/.github#12). Failing here
      costs seconds and names the real cause. Set "0" to disable.
    required: false
    default: "10"
  wait-attempts:
    description: Readiness-check attempts (5s apart) before failing.
    required: false
    default: "90"
  db-wait-attempts:
    description: >-
      Attempts (5s apart) to wait for Postgres to report healthy before
      starting the rest of the stack. Generous by default because the wait
      exists for a contended host: Compose's own depends_on budget expires
      while the box is still busy creating containers, failing the bring-up
      with "dependency failed to start ... is unhealthy" on a database that
      was merely slow. A fast host reaches healthy in a few seconds and the
      remaining budget costs nothing.
    required: false
    default: "120"

outputs:
  hive-sha:
    description: The Hive commit SHA that was checked out (build mode) or recorded in hive-stack/HIVE_SHA (registry mode).
    value: ${{ steps.hive_sha.outputs.sha || steps.hive_sha_registry.outputs.sha }}
  cache-hit:
    description: Whether the built-image cache was hit (build mode only).
    value: ${{ steps.hive_images_cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # A self-hosted runner is a persistent box that other repos' jobs share.
    # A crashed or cancelled run leaves its Hive stack (and the consumer app's
    # containers) running, which then fights the next run for ports 80/443 and
    # for the hive.org hostname. GitHub-hosted runners get a fresh VM every
    # time and need none of this.
    # Nothing below this point can work without a daemon, and every step that
    # follows reports its absence as a bare "exit code 1" from whichever docker
    # command happened to run first. Observed repeatedly on 2026-08-04: runners
    # mks-srvu-dind-WVQLk2fxB8NAX, -PPhz8vuujXFOf and -7wcZgHf9JO72J all came up
    # with no reachable daemon, and three repos' jobs each died on an opaque
    # error one second in. Name the cause once, here.
    #
    # Note this is NOT the disk exhaustion from System-B90/.github#12: the
    # 12:44 hive-core run reported 105 GB free (76% used). The dind sidecar
    # itself is failing to come up, which is a different fault with the same
    # downstream symptoms.
    - name: Verify Docker daemon is reachable
      shell: bash
      run: |
        # Wait, do not just probe once. The dind runners are ephemeral: the
        # runner process registers and accepts a job as soon as it is
        # listening, while `service docker start` is still finishing in the
        # background. A single `docker info` a second into the job therefore
        # fails on a daemon that would have been ready shortly after — which
        # is a spurious red on master, not a host fault.
        #
        # The runner image's job-started hook already waits for dockerd, but
        # it cannot be relied on alone: it is baked into one image, and a
        # daemon can also die mid-run. Waiting here makes the guard correct
        # regardless of which runner variant picked the job up.
        #
        # 300s, matching that hook's own budget. 120s was not enough: on
        # 2026-08-21 a hive-core run waited the full two minutes on
        # mks-dind-ic4g7TwskSpzB and still failed, on a box where the same
        # daemon starts in 2.4s when idle. The same job spent 5m26s in
        # "Set up runner". Under I/O contention this host is simply slow, and
        # waiting costs nothing next to losing an hour-long suite.
        for attempt in $(seq 1 150); do
          if docker info >/dev/null 2>&1; then
            if [ "$attempt" -gt 1 ]; then
              echo "Docker daemon came up after $(( attempt * 2 ))s."
            else
              echo "Docker daemon is up."
            fi
            exit 0
          fi
          sleep 2
        done

        echo "Disk on the runner (for triage — a full disk can stop dockerd starting):"
        df -h / || true

        echo "::error::No reachable Docker daemon on this runner (${RUNNER_NAME:-unknown}) after waiting 300s. Every later step in this job needs one, so it would otherwise fail with an opaque 'exit code 1' from an arbitrary docker command. This is a runner-host fault, not a fault in the calling repo — the dind sidecar did not come up. See System-B90/.github#12."
        exit 1

    - name: Reclaim stale containers from previous runs (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        HIVE_PATH: ${{ inputs.hive-path }}
      run: |
        # Best-effort. Composite `run:` blocks execute under `bash -e -o
        # pipefail`, where a bare `stale=$(docker ps ...)` takes the
        # substitution's exit status and aborts the step — so a daemon that dies
        # mid-run turned cleanup into a hard failure. Reclaiming is opportunistic
        # by nature; it must never be the thing that fails a job.
        set +e
        if [ -f "${HIVE_PATH}/docker-compose.yaml" ]; then
          echo "Tearing down a leftover Hive stack from a previous run..."
          docker compose -f "${HIVE_PATH}/docker-compose.yaml" down -v --remove-orphans || true
        fi
        # Anything still holding :80/:443 blocks Hive's nginx from binding.
        stale=$(docker ps -q --filter "publish=80" --filter "publish=443")
        if [ -n "$stale" ]; then
          echo "Stopping containers still bound to :80/:443:"
          docker ps --filter "publish=80" --filter "publish=443" \
            --format '  {{.Names}} ({{.Image}})'
          docker rm -f $stale || true
        fi
        # Any surviving hive-* container — prometheus and tempo in particular,
        # which publish no ports and so escape the filter above — keeps its
        # bind-mounted data files open, which blocks removal of the workspace
        # later. Clear them before anything tries to remove it.
        leftovers=$(docker ps -aq --filter "name=^/hive-")
        if [ -n "$leftovers" ]; then
          echo "Removing leftover hive-* containers:"
          docker ps -a --filter "name=^/hive-" --format '  {{.Names}} ({{.Status}})'
          docker rm -f $leftovers || true
        fi
        # Volumes and networks orphaned by killed runs accumulate silently.
        docker volume prune -f || true
        docker network prune -f || true
        exit 0

    # Two different jobs, depending on the runner.
    #
    # GitHub-hosted: the preinstalled SDKs (dotnet/android/ghc/CodeQL) eat
    # ~30GB this job never uses, and the VM is thrown away afterwards, so
    # deleting them and flushing the image store outright is free.
    #
    # Self-hosted: those directories aren't ours to remove, but doing *nothing*
    # was the wrong call. I originally skipped this entirely to preserve a warm
    # image cache; the logs show every run re-pulls its Hive images anyway, so
    # there was no cache to preserve — and on 2026-07-24 a runner reported
    # "Free space left: 0 MB" and then "dockerd not ready after 120s". Reclaim
    # what is unambiguously garbage (dangling images, stopped containers,
    # unused build cache) while leaving tagged images other jobs may be using.
    - name: Free disk space
      if: inputs.free-disk-space != 'false'
      shell: bash
      env:
        MODE: ${{ inputs.free-disk-space }}
      run: |
        echo "Disk space before cleanup:"
        df -h /
        if [ "$MODE" = "true" ] || { [ "$MODE" = "auto" ] && [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; }; then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
        else
          # Conservative: no -a, so tagged images survive.
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune -f --keep-storage 10GB || true
          docker volume prune -f || true
        fi
        echo "Disk space after cleanup:"
        df -h /

    # Cleanup above reclaims what it can; this decides whether what remains is
    # enough to bother starting. Every symptom in System-B90/.github#12 —
    # dockerd not ready, 92s container creation, unhealthy Postgres — is what
    # disk exhaustion looks like from inside a job that already committed 20
    # minutes to the attempt.
    - name: Verify enough disk to boot Hive
      if: inputs.min-free-disk-gb != '0'
      shell: bash
      env:
        MIN_FREE_GB: ${{ inputs.min-free-disk-gb }}
      run: |
        avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
        avail_gb=$((avail_kb / 1024 / 1024))
        echo "Free disk after cleanup: ${avail_gb} GB (minimum ${MIN_FREE_GB} GB)"

        if [ "$avail_gb" -lt "$MIN_FREE_GB" ]; then
          echo "Docker is using:"
          docker system df || true
          echo "::error::Only ${avail_gb} GB free on the runner — Hive needs at least ${MIN_FREE_GB} GB. This is the host being full, not a fault in this repo: a job that starts here fails later as 'dockerd not ready after 120s' or an unhealthy Postgres. Reclaim space on the runner host (docker system prune -af --volumes on the HOST, and check /opt/hive and stale _work/ directories), or lower min-free-disk-gb if you know this is safe. See System-B90/.github#12."
          exit 1
        fi

        # Warn well before the cliff, so the trend is visible in run logs
        # rather than only at the point of failure.
        if [ "$avail_gb" -lt $((MIN_FREE_GB * 2)) ]; then
          echo "::warning::Runner disk is low: ${avail_gb} GB free. Jobs will start failing below ${MIN_FREE_GB} GB."
        fi

        echo "Free disk before Hive boot: **${avail_gb} GB**" >> "$GITHUB_STEP_SUMMARY"

    # ── Registry mode: no Hive checkout, no hive-token needed for Hive
    # itself ─────────────────────────────────────────────────────────────
    # Reads docker-compose.yaml/.env/HIVE_SHA from pyhive-repo's hive-stack/
    # directory instead of checking out private Hive source. pyhive-repo is
    # itself private, and GITHUB_TOKEN is always scoped to the triggering
    # repo only — it can't clone another org repo even with the org's
    # Actions "access" setting turned on (that setting only covers reusable
    # workflows/artifacts, not checkout). So this still needs a token with
    # cross-repo read; hive-token doubles as that token here.
    # The self-hosted runner reuses its workspace, and a `hive/` left behind by
    # an earlier sparse-checkout run keeps skip-worktree bits in its index. A
    # fresh `checkout` then finds the index already matching HEAD and writes no
    # files, leaving an empty tree that looks exactly like "the repo doesn't
    # have hive-stack". Removing the directory makes each run start clean.
    - name: Reset Hive stack workspace (registry mode)
      if: inputs.image-source == 'registry'
      shell: bash
      # Hive's containers write into this tree as root (prometheus/tempo data),
      # so an unprivileged rm can leave directories behind and fail the *next*
      # run's checkout with "ENOTEMPTY ... hive/metrics/data/wal". The reclaim
      # step above has already removed the containers holding them open.
      run: rm -rf "${{ inputs.hive-path }}" 2>/dev/null || sudo rm -rf "${{ inputs.hive-path }}"

    - name: Checkout Hive stack config (registry mode)
      if: inputs.image-source == 'registry'
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.pyhive-repo }}
        path: ${{ inputs.hive-path }}
        # No sparse-checkout. The non-cone `hive-stack` pattern resolved to an
        # empty working tree on the self-hosted runner (git 2.43), so the
        # flatten step below failed with "docker-compose.yaml not found" on
        # every run even though the file was present at the checked-out sha.
        # pyhive is ~1.2 MB — sparse was saving nothing worth this failure mode.
        token: ${{ inputs.hive-token || github.token }}
        persist-credentials: false

    - name: Flatten hive-stack config (registry mode)
      if: inputs.image-source == 'registry'
      shell: bash
      working-directory: ${{ inputs.hive-path }}
      run: |
        if [ ! -f hive-stack/docker-compose.yaml ]; then
          echo "::error::${{ inputs.pyhive-repo }}#hive-stack/docker-compose.yaml not found. Has 'Publish Hive Images' run there yet?"
          # What actually landed, so the next failure is diagnosable from the
          # log instead of needing another run to find out.
          echo "pwd: $(pwd)"
          ls -la . || true
          ls -la hive-stack || true
          git -C . log -1 --format='checked out %H' || true
          exit 1
        fi
        # Bash's * glob skips dotfiles (hive-stack/.env) by default, which
        # left it behind and made rmdir fail on a non-empty directory.
        cp -a hive-stack/. .
        rm -rf hive-stack


    - name: Resolve Hive commit (registry mode)
      id: hive_sha_registry
      if: inputs.image-source == 'registry'
      shell: bash
      working-directory: ${{ inputs.hive-path }}
      run: echo "sha=$(cat HIVE_SHA)" >> "$GITHUB_OUTPUT"

    # ── Build mode: full Hive checkout, needs hive-token ───────────────────
    # The Hive repository is private — checkout needs a PAT with read access.
    # Fail early with an actionable message instead of a cryptic checkout error.
    - name: Verify Hive checkout token and branch
      if: inputs.image-source == 'build'
      shell: bash
      env:
        HIVE_CHECKOUT_TOKEN: ${{ inputs.hive-token }}
        HIVE_REPO: ${{ inputs.hive-repo }}
        HIVE_REF: ${{ inputs.hive-ref }}
      run: |
        if [ -z "$HIVE_CHECKOUT_TOKEN" ]; then
          echo "::error::No Hive checkout token configured. image-source: build clones private Hive source and needs a PAT — pass one via hive-token (repo Settings → Secrets and variables → Actions), or switch to image-source: registry (no token needed)."
          exit 1
        fi
        repo_code=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${HIVE_CHECKOUT_TOKEN}" \
          "https://api.github.com/repos/${HIVE_REPO}")
        if [ "$repo_code" = "401" ]; then
          echo "::error::The Hive checkout token is invalid, expired, or revoked (HTTP 401). Generate a new PAT and update the secret."
          exit 1
        fi
        if [ "$repo_code" != "200" ]; then
          echo "::error::The token cannot read ${HIVE_REPO} (HTTP $repo_code). Check: classic PAT has the 'repo' scope; the org allows classic PATs (or SSO-authorize the token); a fine-grained PAT must be approved by the org admins."
          exit 1
        fi
        branch_code=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${HIVE_CHECKOUT_TOKEN}" \
          "https://api.github.com/repos/${HIVE_REPO}/branches/${HIVE_REF}")
        if [ "$branch_code" != "200" ]; then
          echo "::error::The token can read ${HIVE_REPO}, but branch '${HIVE_REF}' was not found (HTTP $branch_code). Available branches:"
          curl -s -H "Authorization: token ${HIVE_CHECKOUT_TOKEN}" \
            "https://api.github.com/repos/${HIVE_REPO}/branches?per_page=100" \
            | python3 -c "import json,sys; [print(' -', b['name']) for b in json.load(sys.stdin)]"
          exit 1
        fi
        echo "Hive token OK — repository and branch '${HIVE_REF}' are reachable."

    # blob:limit=50k mirrors Hive's documented clone (skips >1.5 GiB of large
    # blobs; git lazy-fetches any that the checkout needs).
    - name: Checkout Hive
      if: inputs.image-source == 'build'
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.hive-repo }}
        ref: ${{ inputs.hive-ref }}
        token: ${{ inputs.hive-token }}
        path: ${{ inputs.hive-path }}
        filter: blob:limit=50k
        persist-credentials: false

    - name: Setup Python
      if: inputs.image-source == 'build'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Resolve Hive commit
      id: hive_sha
      if: inputs.image-source == 'build'
      shell: bash
      working-directory: ${{ inputs.hive-path }}
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Appending blindly is fine on a throwaway VM, but a self-hosted box keeps
    # /etc/hosts across runs — an unconditional append grows the file by a few
    # lines on every single CI run, forever. Add each mapping only if the exact
    # line isn't already there.
    - name: Map local hostnames
      shell: bash
      env:
        HIVE_HOSTNAME: ${{ inputs.hive-hostname }}
        HIVE_HOST_IP: ${{ inputs.hive-host-ip }}
        EXTRA_HOSTS: ${{ inputs.extra-hosts }}
      run: |
        add_host() {
          local line="$1"
          [ -z "$line" ] && return 0
          if grep -qxF "$line" /etc/hosts; then
            echo "already mapped: $line"
          else
            echo "$line" | sudo tee -a /etc/hosts
          fi
        }
        # Hive's bind address can change between runs (it moved to a loopback
        # alias so a co-located Bluz can keep :80/:443 on 127.0.0.3). A
        # self-hosted /etc/hosts survives the job, and the *first* matching
        # line wins resolution — so a stale mapping silently sends every
        # client to an address nothing listens on. Replace, don't append.
        map_host() {
          local ip="$1" host="$2"
          if grep -qxF "$ip $host" /etc/hosts; then
            echo "already mapped: $ip $host"
            return 0
          fi
          if awk -v h="$host" '$2 == h { found = 1 } END { exit !found }' /etc/hosts; then
            echo "remapping $host -> $ip (dropping stale entries)"
            sudo cp /etc/hosts /tmp/hosts.setup-hive
            awk -v h="$host" '$2 != h' /tmp/hosts.setup-hive | sudo tee /etc/hosts >/dev/null
          fi
          echo "$ip $host" | sudo tee -a /etc/hosts
        }
        map_host "${HIVE_HOST_IP}" "${HIVE_HOSTNAME}"
        if [ -n "$EXTRA_HOSTS" ]; then
          while IFS= read -r line; do
            add_host "$line"
          done <<< "$EXTRA_HOSTS"
        fi

    # Hive rarely changes, so cache its built prod images keyed on the
    # checked-out Hive commit. On a hit we `docker load` and skip the
    # multi-minute build; when the Hive ref advances, the key changes and we
    # rebuild + re-cache. No restore-keys — an inexact hit would run stale
    # images against a newer checkout, so only an exact SHA reuses.
    # NOTE: actions/cache is per-repo — this does not share across consumer
    # repos. Prefer image-source: registry for cross-repo reuse.
    - name: Cache Hive prod images
      id: hive_images_cache
      if: inputs.image-source == 'build'
      uses: actions/cache@v6
      with:
        path: /tmp/hive-images.tar
        key: hive-prod-images-${{ inputs.cache-version }}-${{ steps.hive_sha.outputs.sha }}

    - name: Load cached Hive images
      if: inputs.image-source == 'build' && steps.hive_images_cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i /tmp/hive-images.tar

    # Registry mode: pull each runtime image the compose file declares from
    # the published namespace and retag it to the local name the compose file
    # expects ("hive/<service>:<tag>"). Images are published by pyhive-repo's
    # "Publish Hive Images" workflow as "<registry-prefix>/<service>:<sha>".
    - name: Pull Hive images from registry
      if: inputs.image-source == 'registry'
      shell: bash
      working-directory: ${{ inputs.hive-path }}
      env:
        REGISTRY_PREFIX: ${{ inputs.registry-prefix }}
        REGISTRY_TAG: ${{ inputs.registry-tag }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        HIVE_SHA: ${{ steps.hive_sha_registry.outputs.sha }}
      run: |
        registry_host="${REGISTRY_PREFIX%%/*}"
        if [ -n "$REGISTRY_TOKEN" ]; then
          echo "$REGISTRY_TOKEN" | docker login "$registry_host" -u "$GITHUB_ACTOR" --password-stdin
        fi
        tag="${REGISTRY_TAG:-$HIVE_SHA}"
        images=$(docker compose -f docker-compose.yaml config --images | grep '^hive/' | sort -u)
        if [ -z "$images" ]; then
          echo "::error::No 'hive/*' images found in docker-compose.yaml — cannot map registry images."
          exit 1
        fi
        for img in $images; do
          name="${img#hive/}"
          name="${name%%:*}"
          remote="${REGISTRY_PREFIX}/${name}:${tag}"
          echo "Pulling ${remote} -> ${img}"
          # ghcr egress from the self-hosted box times out sporadically — a
          # different image failed on each of two consecutive runs with
          # "dial tcp ...:443: i/o timeout". One transient timeout should not
          # cost a whole e2e run, so retry with a short backoff first.
          pulled=""
          for attempt in 1 2 3; do
            if docker pull "$remote"; then
              pulled=1
              break
            fi
            echo "Pull attempt ${attempt}/3 for ${remote} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          if [ -z "$pulled" ]; then
            echo "::error::Failed to pull ${remote}. Check: pyhive-repo's 'Publish Hive Images' workflow has run for this Hive commit; this repo has read access to the packages (package settings → Manage Actions access) or registry-token is a PAT with read:packages; registry-prefix/registry-tag inputs are correct. Fall back to image-source: build if needed."
            exit 1
          fi
          docker tag "$remote" "$img"
        done

    # Bring Hive up in PROD mode (manage_hive.py default env) and run its init
    # non-interactively. This inlines manage_hive.py's prod update()+init()
    # rather than calling them, so the build can be skipped entirely when
    # images came from cache or registry (a plain `docker compose build` would
    # rebuild — `docker load`/`docker pull` restore images, not layer cache).
    #
    # CI adaptations vs `manage_hive.py init`:
    #  * build_deps first on a build-mode miss — prod's update skips it, but a
    #    source build needs the base images (hive/*-base) built.
    #  * createsuperuser --noinput — init's is interactive and hangs.
    #  * dev-only `frontend yarn`/`dummy_db` omitted — prod serves a pre-built
    #    frontend and consumers seed Hive via pyhive.
    # Prod omits the dev override, so pin -f docker-compose.yaml. Hive's
    # committed .env sets HIVE_HOSTNAME_PLAIN=hive.org, ships sample SSL keys,
    # and its nginx publishes 80/443.
    - name: Build & Initialize Hive
      shell: bash
      working-directory: ${{ inputs.hive-path }}
      env:
        IMAGE_SOURCE: ${{ inputs.image-source }}
        HIVE_CACHE_HIT: ${{ steps.hive_images_cache.outputs.cache-hit }}
        DB_WAIT_ATTEMPTS: ${{ inputs.db-wait-attempts }}
      run: |
        # Cap Hive's prod resource footprint for CI. Hive's committed .env
        # sets HIVE_CORE_WORKERS=10 × HIVE_CORE_THREADS=8 gunicorn workers,
        # which on a 2-vCPU runner starves the consumer app's build/runtime
        # (OOM/crash-loop → never ready). docker-compose.yaml loads
        # .env.override (optional) after .env.
        cat > .env.override <<'EOF'
        HIVE_CORE_WORKERS=2
        HIVE_CORE_THREADS=2
        HIVE_NGINX_WORKERS=1
        EOF
        # Postgres 18 refuses to start on a data directory it does not own:
        #   FATAL: data directory "/var/lib/postgresql/18/docker" has wrong ownership
        # HIVE_DATABASE_PATH is a bind mount, and Docker creates a missing bind
        # source as root, so pre-create it and hand it to uid/gid 999 — the
        # ids the image runs as. The workspace must be on a filesystem that
        # actually records ownership; the guard makes a filesystem that does
        # not (an NTFS mount, say) fail here rather than as an opaque
        # restart-loop 10 minutes later.
        db_path="$(grep -E '^HIVE_DATABASE_PATH=' .env | tail -1 | cut -d= -f2-)"
        db_path="${db_path:-./db}"
        mkdir -p "$db_path"
        chown -R 999:999 "$db_path" 2>/dev/null || sudo chown -R 999:999 "$db_path"
        if [ "$(stat -c '%u' "$db_path")" != "999" ]; then
          echo "::error::${db_path} could not be chowned to 999 — this filesystem does not support ownership. Run the job where the workspace is on a real Linux filesystem."
          exit 1
        fi

        compose="docker compose -f docker-compose.yaml"

        if [ "$IMAGE_SOURCE" = "registry" ]; then
          echo "Using registry-pulled Hive images — skipping build."
        elif [ "$HIVE_CACHE_HIT" = "true" ]; then
          echo "Reusing cached Hive images — skipping build."
        else
          echo "No Hive image cache — building from source."
          python3 manage_hive.py build_deps
          $compose build
          # Build cache/dangling layers from compiling nginx/frontend/core
          # from source aren't needed once the final images exist, and
          # `docker save` below needs roughly another full copy's worth of
          # disk for the tar — reclaim first.
          docker builder prune -af || true
        fi

        # Start the datastores first and wait on Postgres here, rather than
        # letting `up -d` enforce it through depends_on. The wait itself lives
        # in wait-for-postgres.sh, which documents why — and is covered by
        # tests/test_wait_for_postgres.py rather than only by a red E2E run.
        echo "Starting datastores first (database, redis)..."
        $compose up -d database redis

        db_cid=$($compose ps -q database)
        if [ -z "$db_cid" ]; then
          echo "::error::Could not resolve the 'database' service container."
          exit 1
        fi

        DB_CID="$db_cid" DB_WAIT_ATTEMPTS="$DB_WAIT_ATTEMPTS" \
          bash "$GITHUB_ACTION_PATH/wait-for-postgres.sh"

        # Start the stack from (cached, pulled, or freshly built) images. The
        # DB volume is never cached, so migrations + seeding run every time.
        #
        # `up` re-evaluates depends_on with its own fixed budget, which the wait
        # above does not extend. Creating the remaining ~12 containers can take
        # longer than that budget on a busy host, and compose then aborts with
        # "dependency failed to start: container hive-postgres is unhealthy" —
        # about a database that is healthy before and after. Retrying costs
        # almost nothing, since the containers it already created survive.
        if ! $compose up -d; then
          echo "Stack bring-up failed; retrying once now that the containers exist."
          docker ps -a --filter "name=^/hive-" --format '  {{.Names}} ({{.Status}})'
          $compose up -d
        fi
        $compose exec -T core python manage.py migrate
        $compose exec -T core python manage.py collectstatic --noinput
        $compose exec -T database sh /update.sh
        $compose exec -T core python manage.py service_accounts
        $compose exec -T core python manage.py load_tags
        $compose exec -T \
          -e DJANGO_SUPERUSER_USERNAME=admin \
          -e DJANGO_SUPERUSER_PASSWORD=Password1 \
          -e DJANGO_SUPERUSER_EMAIL=admin@hive.org \
          core python manage.py createsuperuser --noinput
        $compose exec -T core python manage.py load_programs

        # On a build-mode miss, save the runtime images so the next run
        # reuses them (actions/cache uploads the tar in its post step). Base
        # images are excluded — they are only needed to build.
        if [ "$IMAGE_SOURCE" = "build" ] && [ "$HIVE_CACHE_HIT" != "true" ]; then
          imgs=$(docker images 'hive/*' --format '{{.Repository}}:{{.Tag}}' | grep -v -- '-base' || true)
          if [ -n "$imgs" ]; then
            echo "Disk space before saving Hive image cache:"
            df -h /
            echo "Saving Hive images for cache:"; echo "$imgs"
            docker save -o /tmp/hive-images.tar $imgs
          fi
        fi

    - name: Wait for Hive
      shell: bash
      env:
        HIVE_HOSTNAME: ${{ inputs.hive-hostname }}
        WAIT_ATTEMPTS: ${{ inputs.wait-attempts }}
      run: bash "$GITHUB_ACTION_PATH/wait-for-hive.sh"
