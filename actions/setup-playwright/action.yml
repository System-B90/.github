name: Setup Node + Playwright
description: >-
  Sets up Node.js with npm caching, installs dependencies, and installs
  Playwright browsers. Shared by System-B90 consumer repos' E2E jobs.

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: "24"
  install-command:
    description: Command that installs the repo's Node dependencies.
    required: false
    default: npm ci
  browsers:
    description: Space-separated Playwright browsers to install.
    required: false
    default: chromium
  with-deps:
    description: >-
      Pass --with-deps to `playwright install`, which apt-installs the
      browsers' shared-library dependencies. "auto" (default) enables it only
      on GitHub-hosted runners: those start from a bare VM every time, while a
      self-hosted box already has the libraries from its first run and pays
      ~30-60s of apt (plus a sudo/apt-lock dependency) for nothing on every
      subsequent run. Force with "true"/"false".
    required: false
    default: auto

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install Node dependencies
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Install Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        WITH_DEPS: ${{ inputs.with-deps }}
        RUNNER_ENV: ${{ runner.environment }}
      run: |
        deps=""
        if [ "$WITH_DEPS" = "true" ] || { [ "$WITH_DEPS" = "auto" ] && [ "$RUNNER_ENV" = "github-hosted" ]; }; then
          deps="--with-deps"
        fi
        echo "Installing Playwright browsers: $BROWSERS ${deps:-(no --with-deps)}"
        # shellcheck disable=SC2086
        npx playwright install $BROWSERS $deps
