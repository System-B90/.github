name: Teardown test stack
description: >-
  Removes every compose project on this daemon whose containers are named
  `<prefix>*`: containers, anonymous and named volumes, networks. Use it both
  to reclaim a stack a dead run leaked before the next run starts, and with
  `if: always()` to stop the stack afterwards. Only `<prefix>*` is touched
  unless `prune` is on.

  Covers the app's own test stack; teardown-hive covers Hive. Refuses a
  `hive` prefix so it can never take down the shared Hive.

  Never fails the job. A cleanup error must not turn a green run red.

inputs:
  prefix:
    description: >-
      Container-name prefix of the stack, e.g. `bluz-test-`. Matched from the
      start of the name. Letters, digits, `_`, `.` and `-` only.
    required: true
  compose-files:
    description: >-
      Extra `-f` files for `compose down` (space-separated). Empty uses the
      project's own labels, which also works for a project whose compose file
      is gone.
    required: false
    default: ""
  prune:
    description: >-
      "true" also prunes ALL unused volumes, images and build cache and
      reports free disk. Throwaway VMs only: never on the shared-hive box,
      where it would delete the shared Hive.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Remove the test stacks
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
        COMPOSE_FILES: ${{ inputs.compose-files }}
        PRUNE: ${{ inputs.prune }}
      run: |
        if ! [[ "$PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
          echo "::warning::teardown-test-stack: invalid prefix '$PREFIX'; nothing removed."
          exit 0
        fi
        if [[ "${PREFIX,,}" == hive* ]]; then
          echo "::warning::teardown-test-stack: refusing prefix '$PREFIX'; use teardown-hive for Hive."
          exit 0
        fi
        # Docker's name filter is a regex; escape the dots a prefix may carry.
        pattern="^/${PREFIX//./\\.}"

        files=""
        for f in $COMPOSE_FILES; do files="$files -f $f"; done
        projects=$(docker ps -aq --filter "name=$pattern" \
          | xargs -r docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' \
          | sort -u || true)
        for proj in $projects; do
          echo "Removing compose project: $proj"
          # shellcheck disable=SC2086
          docker compose -p "$proj" $files down -v --remove-orphans || true
        done
        # Whatever survived `compose down` (a project whose files are gone
        # still leaves labelled containers). -v takes anonymous volumes.
        leftovers=$(docker ps -aq --filter "name=$pattern" || true)
        # shellcheck disable=SC2086
        [ -n "$leftovers" ] && docker rm -f -v $leftovers || true
        # Named volumes and networks outlive their containers; once those are
        # gone the project can no longer be discovered from them.
        for proj in $projects; do
          docker volume ls -q --filter "label=com.docker.compose.project=$proj" \
            | xargs -r docker volume rm -f || true
          docker network ls -q --filter "label=com.docker.compose.project=$proj" \
            | xargs -r docker network rm || true
        done

        [ "$PRUNE" = "true" ] || exit 0
        docker volume prune -af || true
        docker builder prune -af || true
        docker image prune -af || true
        docker system df || true
        avail_gb=$(($(df -Pk / | awk 'NR==2 {print $4}') / 1024 / 1024))
        echo "Free disk after reclaim: ${avail_gb} GB"
        if [ "$avail_gb" -lt 10 ]; then
          echo "::warning::Only ${avail_gb} GB free after reclaiming everything this daemon can see. The rest is held by the runner host and needs manual cleanup."
        fi
