# System-B90 offline mirror. Serves /srv/www (staged by build_site.py) on both
# ports: HTTPS with the cert setup.py issues into ./ssl, and plain HTTP for
# clients that can't be given the CA (pip --trusted-host).
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    root /srv/www;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Only the CA's certificate. ./ssl also holds ca.key and key.pem, so it is
    # never served as a directory.
    location = /ca.crt {
        alias /etc/nginx/ssl/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # Read-only: git-http-backend refuses pushes from anonymous clients.
    location ~ ^/marketplace\.git(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
    }

    location / {
        try_files $uri $uri/ =404;
        # Docs, plugin skills and the landing page all name the GitHub Pages
        # address. Point them at whatever address the reader used instead.
        sub_filter 'https://system-b90.github.io/.github' '$scheme://$http_host';
        sub_filter_once off;
        sub_filter_types text/css text/plain text/xml application/javascript application/json;
    }
}
