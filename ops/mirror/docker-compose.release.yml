# Release compose file for the System-B90 offline mirror, shipped as
# docker-compose.yml at the root of its release bundle (see app.json). The
# image tag is pinned to ${MIRROR_VERSION}, which ./install.sh writes from the
# bundle's VERSION file.
name: sb90-mirror

services:
  web:
    image: ghcr.io/system-b90/mirror/web:${MIRROR_VERSION:?MIRROR_VERSION is not set — run ./install.sh, which writes it into .env from the bundle's VERSION file}
    container_name: sb90-mirror-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MIRROR_BIND_IP:-0.0.0.0}:${MIRROR_HTTP_PORT:-80}:80"
      - "${MIRROR_BIND_IP:-0.0.0.0}:${MIRROR_HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
