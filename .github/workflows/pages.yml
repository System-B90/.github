name: Deploy package index

# The Pages site covers the pip index under pypi/ and per-repo docs (e.g.
# bluz/, synced from consumer repos' own docs CI). A branch-source Pages
# deployment rebuilds on every push to main, which meant a full deploy run for
# each unrelated actions/ commit. Path-filtered so it fires only when published
# content actually changes.
on:
    push:
        branches: [main]
        paths: ['pypi/**', 'bluz/**']
    workflow_dispatch:
        inputs:
            runner:
                description: 'Runner environment to execute on'
                required: false
                default: 'self-hosted'
                type: choice
                options:
                    - self-hosted
                    - github-hosted

concurrency:
    group: pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "light"]') }}
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: .
            - id: deployment
              uses: actions/deploy-pages@v4
